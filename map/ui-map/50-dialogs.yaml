# Whole dialogs replaced by macOS system panels: message box, task dialog, file and
# folder pickers, colour/font/print/page setup, find/replace, shell dialogs, progress.
#
# AppKit code runs with: window (the owner NSWindow), view, menu, title, note, items,
# image, action().

entries:
  - id: messagebox
    kind: dialog
    title: Message box
    win32: {apis: [MessageBox, MessageBoxEx, MessageBoxIndirect, MessageBoxTimeout], styles: [MB_OK]}
    runtime: appkit
    appkit:
      - since: 12
        code: |-
          let a = NSAlert()
          a.messageText = title
          a.informativeText = note
          a.alertStyle = .warning
          a.addButton(withTitle: "OK")
          a.beginSheetModal(for: window) { response in _ = response }
    swiftui:
      - since: 12
        code: |-
          Color.clear.alert(title, isPresented: $isPresented) {
            Button("OK", role: .cancel, action: action)
          } message: {
            Text(note)
          }
    glass: automatic
    events_out: {result: the MessageBox return value (IDOK, IDCANCEL, IDYES, ...)}
    notes: >-
      NSAlert is exactly what SwiftUI's .alert shows on macOS; the free-standing form is
      used because the caller isn't a SwiftUI view. The text becomes messageText (bold). The
      caption becomes informativeText only when it isn't just the app's name, since macOS
      alerts already show the app icon. With an owner window the alert is a sheet on it
      (MB_APPLMODAL); otherwise it is app-modal. The calling thread keeps pumping messages
      while waiting, as MessageBox does on Windows.

  - id: taskdialog
    kind: dialog
    title: Task dialog
    win32: {apis: [TaskDialog, TaskDialogIndirect], parts: [TASKDIALOG/TDLG_PRIMARYPANEL, TASKDIALOG/TDLG_MAININSTRUCTIONPANE, TASKDIALOG/TDLG_MAINICON, TASKDIALOG/TDLG_CONTENTPANE, TASKDIALOG/TDLG_CONTENTICON, TASKDIALOG/TDLG_EXPANDEDCONTENT, TASKDIALOG/TDLG_COMMANDLINKPANE, TASKDIALOG/TDLG_SECONDARYPANEL, TASKDIALOG/TDLG_CONTROLPANE, TASKDIALOG/TDLG_BUTTONSECTION, TASKDIALOG/TDLG_BUTTONWRAPPER, TASKDIALOG/TDLG_EXPANDOTEXT, TASKDIALOG/TDLG_EXPANDOBUTTON, TASKDIALOG/TDLG_VERIFICATIONTEXT, TASKDIALOG/TDLG_FOOTNOTEPANE, TASKDIALOG/TDLG_FOOTNOTEAREA, TASKDIALOG/TDLG_FOOTNOTESEPARATOR, TASKDIALOG/TDLG_EXPANDEDFOOTERAREA, TASKDIALOG/TDLG_PROGRESSBAR, TASKDIALOG/TDLG_IMAGEALIGNMENT, TASKDIALOG/TDLG_RADIOBUTTONPANE, TEXTSTYLE/TEXT_MAININSTRUCTION, TEXTSTYLE/TEXT_INSTRUCTION, TEXTSTYLE/TEXT_EXPANDED]}
    runtime: appkit
    appkit:
      - since: 12
        code: |-
          let a = NSAlert()
          a.messageText = title
          a.informativeText = note
          a.showsSuppressionButton = true
          a.suppressionButton?.title = "Don't show this again"
          a.accessoryView = NSHostingView(rootView:
            VStack(alignment: .leading, spacing: 8) {
              ProgressView(value: 0.4).progressViewStyle(.linear)
              DisclosureGroup("Details") { Text(note).font(.callout) }
            }.frame(width: 300))
          a.addButton(withTitle: "Continue")
          a.addButton(withTitle: "Cancel")
          a.beginSheetModal(for: window) { response in _ = response }
    glass: automatic
    state_in: [TDM_SET_ELEMENT_TEXT, TDM_UPDATE_ELEMENT_TEXT, TDM_SET_PROGRESS_BAR_POS, TDM_SET_PROGRESS_BAR_STATE, TDM_SET_MARQUEE_PROGRESS_BAR, TDM_ENABLE_BUTTON, TDM_CLICK_BUTTON, TDM_CLICK_RADIO_BUTTON, TDM_CLICK_VERIFICATION]
    events_out: {created: TDN_CREATED, button: TDN_BUTTON_CLICKED, radio: TDN_RADIO_BUTTON_CLICKED, verify: TDN_VERIFICATION_CLICKED, link: TDN_HYPERLINK_CLICKED, timer: TDN_TIMER, destroyed: TDN_DESTROYED}
    notes: >-
      Main instruction -> messageText; content -> informativeText; verification check box
      -> NSAlert's suppression button. Radio buttons, the progress bar, expanded information
      and the footer are SwiftUI in the alert's accessory view (NSHostingView). Custom and
      command-link buttons are added as alert buttons, which NSAlert stacks vertically when
      there are more than three, the macOS form of a command-link list. The callback's HWND
      is a hidden window of the runtime: the app's TDM_* messages sent to it update the open
      alert. A native button click is reported before anything closes, so TDN_BUTTON_CLICKED
      can keep the dialog open (S_FALSE), as on Windows; TDN_TIMER comes about every 200 ms.
      TDM_NAVIGATE_PAGE isn't supported yet.

  - id: filedialog.open
    kind: dialog
    title: Open file dialog
    win32: {apis: [GetOpenFileName, IFileOpenDialog], styles: [OFN_EXPLORER]}
    runtime: appkit
    appkit:
      - since: 12
        code: |-
          let p = NSOpenPanel()
          p.canChooseFiles = true
          p.canChooseDirectories = false
          p.allowsMultipleSelection = false
          p.allowedContentTypes = [UTType(filenameExtension: "txt") ?? .data]
          p.directoryURL = URL(fileURLWithPath: NSHomeDirectory())
          p.beginSheetModal(for: window) { response in _ = response == .OK ? p.urls : [] }
    swiftui:
      - since: 12
        code: |-
          Color.clear.fileImporter(isPresented: $isPresented, allowedContentTypes: [.data]) { result in _ = result }
    glass: automatic
    events_out: {result: 'OPENFILENAME lpstrFile (Windows path through wine_get_dos_file_name), or IShellItem(s)', change: CDN_SELCHANGE / IFileDialogEvents only when the app asks for them}
    not_translated_when: [OFN_ENABLEHOOK, OFN_ENABLETEMPLATE, OFN_ENABLETEMPLATEHANDLE]
    notes: >-
      The real macOS open panel: iCloud Drive, tags, Quick Look, the sidebar. Filters
      ("Text files|*.txt;*.log") become UTTypes from their extensions; "*.*" allows
      everything. The chosen Unix path is converted to the drive path the app expects. Apps
      that put their own controls inside the dialog (hooks and templates) keep wine's
      dialog, because those controls can't live in a macOS panel.

  - id: filedialog.save
    kind: dialog
    title: Save file dialog
    win32: {apis: [GetSaveFileName, IFileSaveDialog]}
    runtime: appkit
    appkit:
      - since: 12
        code: |-
          let s = NSSavePanel()
          s.nameFieldStringValue = title
          s.allowedContentTypes = [.plainText]
          s.canCreateDirectories = true
          s.beginSheetModal(for: window) { response in _ = response == .OK ? s.url : nil }
    glass: automatic
    notes: >-
      Several filters become a file-format pop-up in an accessory view, as in TextEdit's
      save panel. The native panel confirms replacing an existing file on its own, which is
      what OFN_OVERWRITEPROMPT asks for.

  - id: filedialog.folder
    kind: dialog
    title: Folder picker
    win32: {apis: [SHBrowseForFolder], styles: [FOS_PICKFOLDERS, BIF_RETURNONLYFSDIRS]}
    runtime: appkit
    appkit:
      - since: 12
        code: |-
          let p = NSOpenPanel()
          p.canChooseFiles = false
          p.canChooseDirectories = true
          p.canCreateDirectories = true
          p.prompt = "Choose"
          p.message = note
          p.beginSheetModal(for: window) { response in _ = response == .OK ? p.url : nil }
    glass: automatic
    events_out: {result: PIDL of the chosen folder, callback: BFFM_INITIALIZED / BFFM_SELCHANGED to the app's callback}
    notes: >-
      SHBrowseForFolder's tree dialog and IFileOpenDialog with FOS_PICKFOLDERS both become
      the macOS open panel in folder mode. BFFM_SETSELECTION sets directoryURL. The app's
      callback gets a hidden window of the runtime: BFFM_SETSELECTION, BFFM_SETOKTEXT
      (the prompt), BFFM_SETSTATUSTEXT (under the message) and BFFM_ENABLEOK (validation
      holds the button back) work before and while the panel is up; browsing raises
      BFFM_SELCHANGED with the folder's PIDL. IFileDialog's Show hands its state to the
      same panel code as an OPENFILENAMEW plus FOS_* options; OnFileOk may refuse the
      choice and the panel comes back. Dialogs with IFileDialogCustomize controls, and
      computer or printer pickers, keep wine's dialogs.

  - id: colordialog
    kind: dialog
    title: Colour picker
    win32: {apis: [ChooseColor]}
    runtime: appkit
    appkit:
      - since: 12
        code: |-
          let c = NSColorPanel.shared
          c.showsAlpha = false
          c.color = .systemBlue
          c.accessoryView = NSHostingView(rootView:
            HStack {
              Spacer()
              Button("Cancel", role: .cancel) {}.keyboardShortcut(.cancelAction)
              Button("OK") {}.keyboardShortcut(.defaultAction)
            }.padding(8))
          _ = NSApp.runModal(for: c)
    swiftui:
      - since: 12
        code: "ColorPicker(title, selection: $color, supportsOpacity: false)"
    glass: automatic
    improvised: true
    events_out: {result: CHOOSECOLOR rgbResult and lpCustColors}
    not_translated_when: [CC_ENABLEHOOK, CC_ENABLETEMPLATE, CC_ENABLETEMPLATEHANDLE]
    notes: >-
      ColorPicker is the inline well; the dialog form is NSColorPanel, which SwiftUI opens
      from the well. The system panel is modeless and has no OK button, so a small accessory
      with Cancel/OK and a modal session reproduce ChooseColor's modal contract. The 16
      custom colours are loaded into the panel's colour list.

  - id: fontdialog
    kind: dialog
    title: Font picker
    win32: {apis: [ChooseFont]}
    runtime: appkit
    appkit:
      - since: 12
        code: |-
          let fm = NSFontManager.shared
          fm.setSelectedFont(NSFont.systemFont(ofSize: 13), isMultiple: false)
          let fp = NSFontPanel.shared
          fp.accessoryView = NSHostingView(rootView:
            HStack {
              Spacer()
              Button("Cancel", role: .cancel) {}.keyboardShortcut(.cancelAction)
              Button("OK") {}.keyboardShortcut(.defaultAction)
            }.padding(8))
          fm.orderFrontFontPanel(nil)
          _ = NSApp.runModal(for: fp)
    glass: automatic
    improvised: true
    events_out: {result: CHOOSEFONT LOGFONT, iPointSize and rgbColors}
    not_translated_when: [CF_ENABLEHOOK, CF_ENABLETEMPLATE, CF_ENABLETEMPLATEHANDLE]
    notes: >-
      SwiftUI has no font picker. The macOS font panel lists macOS fonts; the chosen family
      is returned only if wine can load it (it sees /System/Library/Fonts and ~/Library/Fonts),
      otherwise the closest face that GDI enumerates.

  - id: printdialog
    kind: dialog
    title: Print dialog
    win32: {apis: [PrintDlg, PrintDlgEx]}
    runtime: appkit
    appkit:
      - since: 12
        code: |-
          let info = NSPrintInfo.shared
          let pp = NSPrintPanel()
          pp.options = [.showsCopies, .showsPageRange, .showsPaperSize, .showsOrientation]
          _ = pp.runModal(with: info)
    glass: automatic
    events_out: {result: 'PRINTDLG hDevMode/hDevNames, page range, copies; hDC from the chosen printer'}
    not_translated_when: [PD_ENABLEPRINTHOOK, PD_ENABLEPRINTTEMPLATE, PD_ENABLEPRINTTEMPLATEHANDLE]
    notes: >-
      The macOS print panel picks the printer and options; the result is written back into
      the DEVMODE that wine's CUPS printing (wineps) already uses. "Save as PDF" replaces
      "Print to file".

  - id: pagesetup
    kind: dialog
    title: Page setup
    win32: {apis: [PageSetupDlg], styles: [PD_PRINTSETUP]}
    runtime: appkit
    appkit:
      - since: 12
        code: "_ = NSPageLayout().runModal(with: NSPrintInfo.shared)"
    glass: automatic
    not_translated_when: [PSD_ENABLEPAGESETUPHOOK, PSD_ENABLEPAGESETUPTEMPLATE, PSD_ENABLEPAGESETUPTEMPLATEHANDLE]
    notes: >-
      macOS Page Setup has paper size, orientation and scale but no margins; the app's
      margins are passed through unchanged.

  - id: findreplace
    kind: dialog
    title: Find / Replace
    win32: {apis: [FindText, ReplaceText], styles: [FR_DOWN]}
    runtime: swiftui
    swiftui:
      - since: 12
        code: |-
          VStack(alignment: .leading, spacing: 8) {
            TextField("Find", text: $text).textFieldStyle(.roundedBorder)
            TextField("Replace", text: $text).textFieldStyle(.roundedBorder)
            HStack {
              Toggle("Match Case", isOn: $isOn).toggleStyle(.checkbox)
              Toggle("Whole Words", isOn: $isOn).toggleStyle(.checkbox)
            }
            HStack {
              Spacer()
              Button("Replace All", action: action)
              Button("Previous", action: action)
              Button("Next", action: action).keyboardShortcut(.defaultAction)
            }
          }.padding().frame(width: 420)
    glass: automatic
    improvised: true
    events_out: {find: 'the app''s registered FINDMSGSTRING message with FR_FINDNEXT / FR_REPLACE / FR_REPLACEALL / FR_DIALOGTERM'}
    not_translated_when: [FR_ENABLEHOOK, FR_ENABLETEMPLATE, FR_ENABLETEMPLATEHANDLE]
    notes: >-
      A floating utility panel (NSPanel), like TextEdit's classic Find panel. Apple's inline
      find bar (NSTextFinder) needs to own the text view, which the app does. The direction
      radio (Up/Down) becomes Previous/Next buttons.

  - id: shellabout
    kind: dialog
    title: About box
    win32: {apis: [ShellAbout]}
    runtime: appkit
    appkit:
      - since: 12
        code: |-
          NSApp.orderFrontStandardAboutPanel(options: [
            .applicationName: title,
            .credits: NSAttributedString(string: note),
            .applicationIcon: image,
          ])
    glass: automatic

  - id: rundialog
    kind: dialog
    title: Run dialog
    win32: {apis: [RunFileDlg]}
    runtime: swiftui
    swiftui:
      - since: 12
        code: |-
          VStack(alignment: .leading, spacing: 10) {
            Text("Type the name of a program, folder, document, or Internet resource.").font(.callout)
            TextField("Open", text: $text).textFieldStyle(.roundedBorder)
            HStack {
              Spacer()
              Button("Browse…", action: action)
              Button("Cancel", role: .cancel, action: action).keyboardShortcut(.cancelAction)
              Button("Run", action: action).keyboardShortcut(.defaultAction)
            }
          }.padding().frame(width: 420)
    glass: automatic
    improvised: true
    notes: Browse… opens filedialog.open.

  - id: pickicon
    kind: dialog
    title: Change icon dialog
    win32: {apis: [PickIconDlg]}
    runtime: swiftui
    swiftui:
      - since: 12
        code: |-
          VStack(spacing: 10) {
            ScrollView {
              LazyVGrid(columns: [GridItem(.adaptive(minimum: 44))], spacing: 8) {
                ForEach(rows) { _ in Image(nsImage: image).resizable().frame(width: 32, height: 32) }
              }.padding(8)
            }.frame(height: 200).background(Color(nsColor: .controlBackgroundColor))
            HStack {
              Spacer()
              Button("Cancel", role: .cancel, action: action).keyboardShortcut(.cancelAction)
              Button("OK", action: action).keyboardShortcut(.defaultAction)
            }
          }.padding().frame(width: 360)
    glass: automatic
    improvised: true

  - id: restartdialog
    kind: dialog
    title: Restart prompt
    win32: {apis: [RestartDialog, RestartDialogEx]}
    runtime: appkit
    appkit:
      - since: 12
        code: |-
          let a = NSAlert()
          a.messageText = title
          a.informativeText = note
          a.addButton(withTitle: "Restart")
          a.addButton(withTitle: "Later")
          _ = a.runModal()
    glass: automatic
    notes: >-
      "Restart" restarts the wine session (wineboot --restart), not the Mac, which is what
      the app actually needs.

  - id: fileprogress
    kind: dialog
    title: File operation progress
    win32: {apis: [SHFileOperation, IFileOperation, IProgressDialog]}
    runtime: swiftui
    swiftui:
      - since: 12
        code: |-
          VStack(alignment: .leading, spacing: 6) {
            Text(title).font(.headline)
            ProgressView(value: value).progressViewStyle(.linear)
            HStack {
              Text(note).font(.caption).foregroundStyle(.secondary)
              Spacer()
              Button("Stop", role: .cancel, action: action)
            }
          }.padding().frame(width: 380)
    glass: automatic
    events_out: {cancel: IProgressDialog::HasUserCancelled / SHFileOperation fAnyOperationsAborted}
    notes: >-
      The Finder copy window. Conflicts ("replace the file?") are NSAlerts with
      Keep Both / Stop / Replace, Finder's wording.

flags:
  # MessageBox buttons and icons (AppKit, on the NSAlert of the messagebox entry)
  MB_OKCANCEL: {appkit: 'let a = NSAlert(); a.addButton(withTitle: "OK"); a.addButton(withTitle: "Cancel")'}
  MB_YESNO: {appkit: 'let a = NSAlert(); a.addButton(withTitle: "Yes"); a.addButton(withTitle: "No")'}
  MB_YESNOCANCEL: {appkit: 'let a = NSAlert(); a.addButton(withTitle: "Yes"); a.addButton(withTitle: "No"); a.addButton(withTitle: "Cancel")'}
  MB_RETRYCANCEL: {appkit: 'let a = NSAlert(); a.addButton(withTitle: "Retry"); a.addButton(withTitle: "Cancel")'}
  MB_ABORTRETRYIGNORE: {appkit: 'let a = NSAlert(); a.addButton(withTitle: "Abort"); a.addButton(withTitle: "Retry"); a.addButton(withTitle: "Ignore")'}
  MB_CANCELTRYCONTINUE: {appkit: 'let a = NSAlert(); a.addButton(withTitle: "Continue"); a.addButton(withTitle: "Try Again"); a.addButton(withTitle: "Cancel")'}
  MB_DEFBUTTON1: {behavior: "the first button is the default (Return)"}
  MB_DEFBUTTON2: {appkit: 'let a = NSAlert(); a.addButton(withTitle: "Yes"); a.addButton(withTitle: "No"); a.buttons[0].keyEquivalent = ""; a.buttons[1].keyEquivalent = "\r"'}
  MB_DEFBUTTON3: {appkit: 'let a = NSAlert(); a.addButton(withTitle: "Yes"); a.addButton(withTitle: "No"); a.addButton(withTitle: "Cancel"); a.buttons[0].keyEquivalent = ""; a.buttons[2].keyEquivalent = "\r"'}
  MB_DEFBUTTON4: {behavior: "the Help button is never the default on macOS; falls back to the first button"}
  MB_ICONERROR: {appkit: 'let a = NSAlert(); a.alertStyle = .critical', note: MB_ICONHAND and MB_ICONSTOP are the same value}
  MB_ICONHAND: {appkit: 'let a = NSAlert(); a.alertStyle = .critical'}
  MB_ICONSTOP: {appkit: 'let a = NSAlert(); a.alertStyle = .critical'}
  MB_ICONWARNING: {appkit: 'let a = NSAlert(); a.alertStyle = .warning'}
  MB_ICONEXCLAMATION: {appkit: 'let a = NSAlert(); a.alertStyle = .warning'}
  MB_ICONINFORMATION: {appkit: 'let a = NSAlert(); a.alertStyle = .informational'}
  MB_ICONASTERISK: {appkit: 'let a = NSAlert(); a.alertStyle = .informational'}
  MB_ICONQUESTION: {appkit: 'let a = NSAlert(); a.alertStyle = .informational', note: macOS has no question icon; Apple's guidelines reserve it}
  MB_USERICON: {appkit: 'let a = NSAlert(); a.icon = image'}
  MB_HELP: {appkit: 'let a = NSAlert(); a.showsHelp = true', note: the help button sends WM_HELP to the owner}
  MB_APPLMODAL: {behavior: "sheet on the owner window when there is one, else app-modal"}
  MB_TASKMODAL: {behavior: "app-modal (runModal) for the calling thread's windows"}
  MB_SYSTEMMODAL: {appkit: 'let a = NSAlert(); a.window.level = .floating; _ = a.runModal()'}
  MB_TOPMOST: {appkit: 'let a = NSAlert(); a.window.level = .floating'}
  MB_SETFOREGROUND: {appkit: 'NSApp.activate(ignoringOtherApps: true)'}
  MB_NOFOCUS: {ignore: "the alert always takes focus on macOS"}
  MB_RIGHT: {behavior: "right-aligned text (right-to-left languages only)"}
  MB_RTLREADING: {behavior: "right-to-left text; NSAlert follows the text's direction"}
  MB_DEFAULT_DESKTOP_ONLY: {behavior: "shown as an ordinary app-modal alert"}
  MB_SERVICE_NOTIFICATION: {behavior: "shown as an ordinary app-modal alert"}

  # TaskDialog
  TDF_ALLOW_DIALOG_CANCELLATION: {behavior: "Escape and the close button cancel (IDCANCEL)"}
  TDF_CALLBACK_TIMER: {behavior: "TDN_TIMER every ~200 ms while the alert is up"}
  TDF_CAN_BE_MINIMIZED: {ignore: "alerts can't be minimised on macOS"}
  TDF_ENABLE_HYPERLINKS: {view: 'Text(attributed).environment(\.openURL, OpenURLAction { _ in .handled })', note: links in the accessory text raise TDN_HYPERLINK_CLICKED}
  TDF_EXPANDED_BY_DEFAULT: {behavior: "the Details disclosure starts open"}
  TDF_EXPAND_FOOTER_AREA: {behavior: "expanded text goes under the footer"}
  TDF_NO_DEFAULT_RADIO_BUTTON: {behavior: "no radio selected initially"}
  TDF_NO_SET_FOREGROUND: {behavior: "the app isn't activated"}
  TDF_POSITION_RELATIVE_TO_WINDOW: {behavior: "sheet on hwndParent"}
  TDF_RTL_LAYOUT: {mod: '.environment(\.layoutDirection, .rightToLeft)'}
  TDF_SHOW_MARQUEE_PROGRESS_BAR: {view: "ProgressView().progressViewStyle(.linear)"}
  TDF_SHOW_PROGRESS_BAR: {view: 'ProgressView(value: value).progressViewStyle(.linear)'}
  TDF_SIZE_TO_CONTENT: {ignore: "alerts size themselves"}
  TDF_USE_COMMAND_LINKS: {behavior: "custom buttons are added as stacked alert buttons (title only)"}
  TDF_USE_COMMAND_LINKS_NO_ICON: {behavior: "as TDF_USE_COMMAND_LINKS"}
  TDF_USE_HICON_FOOTER: {ignore: "footer icons aren't shown in macOS alerts"}
  TDF_USE_HICON_MAIN: {appkit: 'let a = NSAlert(); a.icon = image'}
  TDF_VERIFICATION_FLAG_CHECKED: {appkit: 'let a = NSAlert(); a.showsSuppressionButton = true; a.suppressionButton?.state = .on'}
  TDCBF_OK_BUTTON: {appkit: 'let a = NSAlert(); a.addButton(withTitle: "OK")'}
  TDCBF_YES_BUTTON: {appkit: 'let a = NSAlert(); a.addButton(withTitle: "Yes")'}
  TDCBF_NO_BUTTON: {appkit: 'let a = NSAlert(); a.addButton(withTitle: "No")'}
  TDCBF_CANCEL_BUTTON: {appkit: 'let a = NSAlert(); a.addButton(withTitle: "Cancel")'}
  TDCBF_RETRY_BUTTON: {appkit: 'let a = NSAlert(); a.addButton(withTitle: "Retry")'}
  TDCBF_CLOSE_BUTTON: {appkit: 'let a = NSAlert(); a.addButton(withTitle: "Close")'}

  # Open / save (GetOpenFileName OFN_*, IFileDialog FOS_*)
  OFN_ALLOWMULTISELECT: {appkit: 'let p = NSOpenPanel(); p.allowsMultipleSelection = true'}
  FOS_ALLOWMULTISELECT: {appkit: 'let p = NSOpenPanel(); p.allowsMultipleSelection = true'}
  OFN_FORCESHOWHIDDEN: {appkit: 'let p = NSOpenPanel(); p.showsHiddenFiles = true'}
  FOS_FORCESHOWHIDDEN: {appkit: 'let p = NSOpenPanel(); p.showsHiddenFiles = true'}
  OFN_NODEREFERENCELINKS: {appkit: 'let p = NSOpenPanel(); p.resolvesAliases = false'}
  FOS_NODEREFERENCELINKS: {appkit: 'let p = NSOpenPanel(); p.resolvesAliases = false'}
  FOS_STRICTFILETYPES: {appkit: 'let s = NSSavePanel(); s.allowsOtherFileTypes = false'}
  OFN_CREATEPROMPT: {behavior: "after the panel closes, a missing file triggers a \"create it?\" alert"}
  FOS_CREATEPROMPT: {behavior: "after the panel closes, a missing file triggers a \"create it?\" alert"}
  OFN_OVERWRITEPROMPT: {behavior: "the save panel asks before replacing, natively"}
  FOS_OVERWRITEPROMPT: {behavior: "the save panel asks before replacing, natively"}
  OFN_FILEMUSTEXIST: {behavior: "the open panel only returns existing files"}
  FOS_FILEMUSTEXIST: {behavior: "the open panel only returns existing files"}
  OFN_PATHMUSTEXIST: {behavior: "panels only return existing folders"}
  FOS_PATHMUSTEXIST: {behavior: "panels only return existing folders"}
  OFN_NOCHANGEDIR: {behavior: "the process's current directory isn't changed"}
  FOS_NOCHANGEDIR: {behavior: "the process's current directory isn't changed"}
  OFN_DONTADDTORECENT: {behavior: "the file isn't added to recent documents"}
  FOS_DONTADDTORECENT: {behavior: "the file isn't added to recent documents"}
  OFN_NOREADONLYRETURN: {behavior: "read-only files are rejected with an alert"}
  FOS_NOREADONLYRETURN: {behavior: "read-only files are rejected with an alert"}
  OFN_NOTESTFILECREATE: {behavior: "no test-create of the file"}
  FOS_NOTESTFILECREATE: {behavior: "no test-create of the file"}
  OFN_NOVALIDATE: {behavior: "the name is returned without validation"}
  FOS_NOVALIDATE: {behavior: "the name is returned without validation"}
  OFN_SHAREAWARE: {behavior: "sharing violations are returned to the app"}
  FOS_SHAREAWARE: {behavior: "sharing violations are returned to the app"}
  OFN_SHAREFALLTHROUGH: {behavior: "sharing-violation answer from the hook"}
  OFN_SHARENOWARN: {behavior: "sharing-violation answer from the hook"}
  OFN_SHAREWARN: {behavior: "sharing-violation answer from the hook"}
  OFN_ENABLEHOOK: {not_translated: "the app's hook procedure expects wine's dialog"}
  OFN_ENABLETEMPLATE: {not_translated: "the app adds its own controls to the dialog"}
  OFN_ENABLETEMPLATEHANDLE: {not_translated: "the app adds its own controls to the dialog"}
