# (IDB_STD_*, IDB_VIEW_*, IDB_HIST_*, small or large); <module>/<bitmap>/<index> are the
# strips of wine's own programs and dlls (a bitmap by name or id). A strip an app puts in
# an image list of its own (ImageList_LoadImage, ImageList_Add: Internet Explorer's
# toolbar, cryptui's and aclui's lists) is known by its pixels, whatever mask colour or
# colour depth the list has. Same image kinds as the icons above. Not here: msi's feature
# tree states, the cards, winemine's faces and the theme's parts, which are pictures of
