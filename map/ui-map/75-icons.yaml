# Stock icons: wine's Windows artwork swapped for the macOS image that means the same.
#
# Keys are <module>/<resource name>: the icon resources of wine's user32 (OIC_*, what
# LoadIcon(NULL, IDI_*) loads), shell32 (IDI_SHELL_*, what the shell's file lists and
# SHGetStockIconInfo use) and wine's own programs (regedit's keys and values). tools/gen_runtime_tables.py resolves each name to its id in the
# wine headers and writes the runtime's table.
#
# The runtime knows an icon by where it came from (GetIconInfoExW: module and resource id).
# An icon copied into an image list has lost that, so the runtime also puts each stock icon
# through a copy of the same image list and compares pixels: an exact match is that icon.
# App icons match nothing and stay the app's own artwork.
#
# What an icon becomes (exactly one of):
#   sf: SF Symbol name (macOS 12 floor: tools/check_map.py checks each against the system's
#       symbol availability). Drawn hierarchical in the accent colour, or
#       multicolor: true (the symbol's own colours), or palette: [NSColor, ...].
#   uttype: a Uniform Type Identifier; Finder's icon for that kind of file.
#   file: a path; Finder's icon for it (~ is the home folder).
#   nsimage: an NSImage name (NSImage.Name raw value).
#   app: a bundle identifier; that application's icon.

icons:
  # user32: what MessageBox-style dialogs and apps load with LoadIcon(NULL, IDI_*)
  user32/OIC_SAMPLE: {aka: [IDI_APPLICATION], uttype: com.apple.application-bundle, note: an app with no icon of its own}
  user32/OIC_HAND: {aka: [IDI_HAND, IDI_ERROR], sf: xmark.octagon.fill, multicolor: true}
  user32/OIC_QUES: {aka: [IDI_QUESTION], sf: questionmark.circle.fill, palette: [white, systemBlue]}
  user32/OIC_BANG: {aka: [IDI_EXCLAMATION, IDI_WARNING], nsimage: NSCaution, note: the caution triangle of macOS alerts}
  user32/OIC_NOTE: {aka: [IDI_ASTERISK, IDI_INFORMATION], sf: info.circle.fill, palette: [white, systemBlue]}
  user32/OIC_WINLOGO: {aka: [IDI_WINLOGO], uttype: com.apple.application-bundle}
  user32/OIC_SHIELD: {aka: [IDI_SHIELD], sf: lock.shield.fill, palette: [white, systemBlue], note: "UAC's shield: macOS asks for an administrator with a lock"}

  # shell32: files, folders and places
  shell32/IDI_SHELL_FILE: {uttype: public.data}
  shell32/IDI_SHELL_DOCUMENT: {uttype: public.plain-text}
  shell32/IDI_SHELL_WINDOW: {uttype: com.apple.application-bundle, note: a program}
  shell32/IDI_SHELL_FOLDER: {uttype: public.folder}
  shell32/IDI_SHELL_FOLDER_OPEN: {uttype: public.folder}
  shell32/IDI_SHELL_FOLDER_SMALL_XP: {uttype: public.folder}
  shell32/IDI_SHELL_FOLDER_OPEN_LARGE: {uttype: public.folder}
  shell32/IDI_SHELL_FOLDER_OPEN_SMALL: {uttype: public.folder}
  shell32/IDI_SHELL_5_12_FLOPPY: {sf: externaldrive}
  shell32/IDI_SHELL_3_14_FLOPPY: {sf: externaldrive}
  shell32/IDI_SHELL_FLOPPY: {sf: externaldrive}
  shell32/IDI_SHELL_DRIVE: {file: /, note: the startup disk's icon}
  shell32/IDI_SHELL_NETDRIVE: {nsimage: NSNetwork}
  shell32/IDI_SHELL_NETDRIVE2: {nsimage: NSNetwork}
  shell32/IDI_SHELL_OPTICAL_DRIVE: {sf: opticaldiscdrive}
  shell32/IDI_SHELL_MUSIC_CD: {sf: opticaldisc}
  shell32/IDI_SHELL_RAMDISK: {sf: memorychip}
  shell32/IDI_SHELL_UNKNOWN_DRIVE: {sf: externaldrive}
  shell32/IDI_SHELL_ENTIRE_NETWORK: {nsimage: NSNetwork}
  shell32/IDI_SHELL_NETWORK: {nsimage: NSNetwork}
  shell32/IDI_SHELL_MY_NETWORK_PLACES: {nsimage: NSNetwork}
  shell32/IDI_SHELL_COMPUTERS_NEAR_ME: {nsimage: NSNetwork}
  shell32/IDI_SHELL_MY_COMPUTER: {nsimage: NSComputer}
  shell32/IDI_SHELL_DESKTOP: {file: ~/Desktop}
  shell32/IDI_SHELL_APP_FOLDER: {file: /Applications}
  shell32/IDI_SHELL_START_MENU: {app: com.apple.launchpad.launcher}
  shell32/IDI_SHELL_CONTROL_PANEL: {app: com.apple.systempreferences, note: System Settings from macOS 13, System Preferences before}
  shell32/IDI_SHELL_CONTROL_PANEL_XP: {app: com.apple.systempreferences}
  shell32/IDI_SHELL_SETTINGS: {app: com.apple.systempreferences}
  shell32/IDI_SHELL_FONTS_FOLDER: {app: com.apple.FontBook}
  shell32/IDI_SHELL_PRINTER: {sf: printer.fill}
  shell32/IDI_SHELL_PRINTERS_FOLDER: {sf: printer.fill}
  shell32/IDI_SHELL_PRINTERS_FOLDER_XP: {sf: printer.fill}
  shell32/IDI_SHELL_REMOTE_PRINTER: {sf: printer.fill}
  shell32/IDI_SHELL_TO_FILE_PRINTER: {sf: printer.fill}
  shell32/IDI_SHELL_EMPTY_RECYCLE_BIN: {nsimage: NSTrashEmpty}
  shell32/IDI_SHELL_FULL_RECYCLE_BIN: {nsimage: NSTrashFull}
  shell32/IDI_SHELL_TRASH_FILE: {nsimage: NSTrashFull}
  shell32/IDI_SHELL_TRASH_FOLDER: {nsimage: NSTrashFull}
  shell32/IDI_SHELL_TRASH_MIXED: {nsimage: NSTrashFull}
  shell32/IDI_SHELL_RECENT_DOCUMENTS: {sf: clock}
  shell32/IDI_SHELL_SEARCH: {sf: magnifyingglass}
  shell32/IDI_SHELL_SEARCH_FOLDER: {sf: magnifyingglass}
  shell32/IDI_SHELL_FILE_SEARCH: {sf: magnifyingglass}
  shell32/IDI_SHELL_SYSTEM_SEARCH: {sf: magnifyingglass}
  shell32/IDI_SHELL_HELP: {sf: questionmark.circle}
  shell32/IDI_SHELL_RUN: {sf: terminal}
  shell32/IDI_SHELL_RUN2: {sf: terminal}
  shell32/IDI_SHELL_SLEEP: {sf: moon.zzz}
  shell32/IDI_SHELL_EJECT: {sf: eject}
  shell32/IDI_SHELL_SHUT_DOWN: {sf: power}
  shell32/IDI_SHELL_CONFIRM_SHUTDOWN: {sf: power}
  shell32/IDI_SHELL_LOG_OFF: {sf: rectangle.portrait.and.arrow.right}
  shell32/IDI_SHELL_FAVORITES: {sf: star}
  shell32/IDI_SHELL_UPDATE: {sf: arrow.triangle.2.circlepath}
  shell32/IDI_SHELL_SECURITY: {sf: lock.shield}
  shell32/IDI_SHELL_FILES: {sf: doc.on.doc}
  shell32/IDI_SHELL_INSTALL: {uttype: com.apple.installer-package-archive}
  shell32/IDI_SHELL_CONFIG_FILE: {uttype: public.plain-text}
  shell32/IDI_SHELL_TEXT_FILE: {uttype: public.plain-text}
  shell32/IDI_SHELL_BATCH_FILE: {uttype: public.shell-script}
  shell32/IDI_SHELL_LIBRARY_FILE: {uttype: public.data}
  shell32/IDI_SHELL_SYSTEM_FONT: {uttype: public.font}
  shell32/IDI_SHELL_TRUETYPE_FONT: {uttype: public.truetype-ttf-font}
  shell32/IDI_SHELL_POSTSCRIPT_FONT: {uttype: com.adobe.postscript-font}
  shell32/IDI_SHELL_BACKUP: {sf: externaldrive.badge.timemachine}

  # regedit (wine's own program: its tree and list icons are wine's artwork too)
  regedit/IDI_CLOSED_FILE: {uttype: public.folder}
  regedit/IDI_OPEN_FILE: {uttype: public.folder}
  regedit/IDI_ROOT: {nsimage: NSComputer}
  regedit/IDI_STRING: {sf: textformat.abc}
  regedit/IDI_BIN: {sf: number}

# Toolbar images: the images of an image strip a toolbar adds (TB_ADDBITMAP, TB_LOADIMAGES),
# by strip and index. comctl32/<STD_*|VIEW_*|HIST_*> are the standard strips
# (IDB_STD_*, IDB_VIEW_*, IDB_HIST_*, small or large); <program>/<bitmap>/<index> are the
# strips of wine's own programs. Same image kinds as the icons above.
toolbar_images:
  comctl32/STD_CUT: {sf: scissors}
  comctl32/STD_COPY: {sf: doc.on.doc}
  comctl32/STD_PASTE: {sf: doc.on.clipboard}
  comctl32/STD_UNDO: {sf: arrow.uturn.backward}
  comctl32/STD_REDOW: {sf: arrow.uturn.forward}
  comctl32/STD_DELETE: {sf: trash}
  comctl32/STD_FILENEW: {sf: doc.badge.plus}
  comctl32/STD_FILEOPEN: {sf: folder}
  comctl32/STD_FILESAVE: {sf: square.and.arrow.down}
  comctl32/STD_PRINTPRE: {sf: doc.text.magnifyingglass}
  comctl32/STD_PROPERTIES: {sf: info.circle}
  comctl32/STD_HELP: {sf: questionmark.circle}
  comctl32/STD_FIND: {sf: magnifyingglass}
  comctl32/STD_REPLACE: {sf: arrow.left.arrow.right}
  comctl32/STD_PRINT: {sf: printer}
  comctl32/VIEW_LARGEICONS: {sf: square.grid.2x2}
  comctl32/VIEW_SMALLICONS: {sf: square.grid.3x3}
  comctl32/VIEW_LIST: {sf: list.bullet}
  comctl32/VIEW_DETAILS: {sf: list.bullet.rectangle}
  comctl32/VIEW_SORTNAME: {sf: textformat}
  comctl32/VIEW_SORTSIZE: {sf: arrow.up.arrow.down}
  comctl32/VIEW_SORTDATE: {sf: calendar}
  comctl32/VIEW_SORTTYPE: {sf: doc}
  comctl32/VIEW_PARENTFOLDER: {sf: arrow.turn.left.up}
  comctl32/VIEW_NETCONNECT: {sf: network}
  comctl32/VIEW_NETDISCONNECT: {sf: xmark.circle}
  comctl32/VIEW_NEWFOLDER: {sf: folder.badge.plus}
  comctl32/VIEW_VIEWMENU: {sf: ellipsis.circle}
  comctl32/HIST_BACK: {sf: chevron.backward}
  comctl32/HIST_FORWARD: {sf: chevron.forward}
  comctl32/HIST_FAVORITES: {sf: star}
  comctl32/HIST_ADDTOFAVORITES: {sf: star.circle}
  comctl32/HIST_VIEWTREE: {sf: sidebar.left}
  # wordpad: its toolbar's date button, and the format bar (TextEdit's own symbols)
  wordpad/IDB_TOOLBAR/0: {sf: calendar.badge.clock}
  wordpad/IDB_FORMATBAR/0: {sf: bold}
  wordpad/IDB_FORMATBAR/1: {sf: italic}
  wordpad/IDB_FORMATBAR/2: {sf: underline}
  wordpad/IDB_FORMATBAR/3: {sf: paintpalette}
  wordpad/IDB_FORMATBAR/4: {sf: text.alignleft}
  wordpad/IDB_FORMATBAR/5: {sf: text.aligncenter}
  wordpad/IDB_FORMATBAR/6: {sf: text.alignright}
  wordpad/IDB_FORMATBAR/7: {sf: list.bullet}
